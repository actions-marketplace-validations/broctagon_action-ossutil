name: "action-ossutil"
description: "GitHub Action to use Alibaba Cloud OSS Util"
author: Broctagon Crm Teams

branding:
  icon: "upload-cloud"
  color: "orange"

inputs:
  version:
    description: "ossutil 版本，默认 2.4.0"
    required: false
    default: "2.4.0"
  region:
    description: "OSS 地域 ID，如 ap-southeast-1"
    required: true
  endpoint:
    description: "OSS Endpoint"
    required: false
  access-key-id:
    description: "AccessKey ID"
    required: false
  access-key-secret:
    description: "AccessKey Secret"
    required: false
  sts-token:
    description: "STS Token"
    required: false
  variant:
    description: "特殊变体，仅 windows-amd64-go1.20 需填 go1.20"
    required: false

outputs:
  ossutil-path:
    description: "ossutil 可执行文件路径"
  ossutil-version:
    description: "实际安装的 ossutil 版本"

runs:
  using: "node20"
  main: "dist/index.js"